[package]
name = "sluhk"
version = "2.8.11"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
    # notification center component
    "Foundation",
    "Storage",
    "Storage_Search",
    "UI",
    "UI_Composition",
    "UI_Core",
    "UI_Text",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_HiDpi",
] }
windows-core = { workspace = true }
windows-collections = { workspace = true }
windows-numerics = { workspace = true }
uuid = { workspace = true, features = ["serde"] }

# Usamos la librería IPC del proyecto
slu-ipc = { path = "../../libs/slu-ipc" }

[build-dependencies]
windows-bindgen = "0.66.0"
